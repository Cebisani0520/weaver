[mypy]
python_version = 3.13
strict = True
files = scripts, services, tests, conftest.py
explicit_package_bases = True

[mypy-hcl2.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-confluent_kafka.*]
ignore_missing_imports = True

[mypy-pyflink.*]
ignore_missing_imports = True
